# Builds the browser port and publishes it two ways, both from the same
# compiled web/ folder:
#
#   * iOS / iPadOS / desktop: an installable offline web app (PWA) on GitHub
#     Pages -- open the link once, "Add to Home Screen", done. No Mac, no
#     developer account, no signing, no expiry (docs/INSTALL.md, "Path D").
#   * Android: a real APK (the WebView shell in browser_ver/native/android
#     with web/ bundled inside), placed on that same Pages site as
#     iTamaPoke.apk so it downloads straight from the phone's browser.
#
# What gets published is code only: the MIT-licensed game engine compiled to
# WASM, the UI, and the generic egg app icon. No sprites, cries or dex text
# are in the repository or in either build -- every player loads those from
# their own device through the in-page file pickers (see NOTICE). The
# "refuse to publish" check below enforces that mechanically.
#
# One-time setup on the repository: Settings -> Pages -> Source: "GitHub
# Actions". After that every push to main that touches the browser build
# redeploys; the address is https://<owner>.github.io/<repo>/.

name: Build (browser)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "browser_ver/**"
      - "upstream-expanded/**"
      - "Resources/DefaultAppIcon.png"
      - ".github/workflows/build-browser.yml"
      - ".github/workflows/quality-gate.yml"
      - ".github/workflows/test-quality.yml"
      - "tests/**"
      - "tools/quality/**"
      - "tools/browser-tests/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: Qualitaet vor Veroeffentlichung
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read

  web:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iTamaPoke-D1-Test
          path: browser_ver/web
      - name: Geprueftes Webpaket kontrollieren
        shell: bash
        run: |
          set -euo pipefail
          test -s browser_ver/web/tp_core.js
          test -s browser_ver/web/tp_core.wasm
          if ls browser_ver/web | grep -Eiq '^(p|ps)[0-9]+(-mega(-[a-z]+)?)?\.bin$|^psnd[0-9]+\.|^dex_entries_|^thumbs\.bin$'; then
            echo "Abbruch: Figuren-Dateien im Webpaket." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: browser_ver/web
          if-no-files-found: error
          retention-days: 7

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: browser_ver/native/android/app/src/main/assets/web

      - name: Launcher icon from the shared mascot PNG
        run: |
          set -e
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq imagemagick >/dev/null
          cd browser_ver/native/android/app/src/main
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; px=${d##*:}
            mkdir -p "res/mipmap-$name"
            convert "$GITHUB_WORKSPACE/Resources/DefaultAppIcon.png" -resize ${px}x${px} "res/mipmap-$name/ic_launcher.png"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Debug build: signed with the SDK's debug key, which is exactly what
      # lets it install on any phone without a Play/keystore setup. There is
      # no store listing to sign for -- LICENSE, personal use.
      - name: Build the APK
        working-directory: browser_ver/native/android
        run: gradle assembleDebug --no-daemon --warning-mode=none

      - name: Collect
        run: |
          set -e
          apk=$(ls browser_ver/native/android/app/build/outputs/apk/debug/*.apk | head -n1)
          test -s "$apk"
          mkdir -p out && cp "$apk" out/iTamaPoke.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/iTamaPoke.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [web, android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: site
      - run: ls -la site

      # Same folder, also downloadable from the run page.
      - uses: actions/upload-artifact@v4
        with:
          name: iTamaPoke-browser
          path: site
          retention-days: 90

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
