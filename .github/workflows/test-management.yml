name: Test Paket B

on:
  push:
    branches: [komfort-b]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Package A and B tests
        run: |
          node tests/package-a.test.js
          node tests/package-b.test.js
          for file in browser_ver/web/*.js; do node --check "$file"; done
          g++ -std=c++17 -I browser_ver/core/shim -I upstream-expanded upstream-expanded/pet.cpp tests/package_a.cpp -o /tmp/package-a-test
          /tmp/package-a-test
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build WASM core
        run: bash browser_ver/build.sh
      - name: Prepare test files
        shell: bash
        run: |
          set -e
          cp Resources/DefaultAppIcon.png browser_ver/web/icon.png
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" browser_ver/web/sw.js
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" browser_ver/web/index.html
          test -s browser_ver/web/tp_core.js
          test -s browser_ver/web/tp_core.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: iTamaPoke-Paket-B-Test
          path: browser_ver/web
          if-no-files-found: error
          retention-days: 7
