name: Test Paket C5

on:
  push:
    branches: [komfort-c5]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: JavaScript regressions and syntax
        run: |
          node tests/package-a.test.js
          node tests/package-b.test.js
          node tests/package-c1-ui.test.js
          node tests/package-c2-ui.test.js
          node tests/package-c4-ui.test.js
          node tests/package-c5-ui.test.js
          node tests/package-c5-theme.test.js
          for file in browser_ver/web/*.js; do node --check "$file"; done
      - name: Native regressions
        run: |
          g++ -O2 -std=c++17 -I browser_ver/core/shim -I upstream-expanded upstream-expanded/pet.cpp tests/package_a.cpp -o /tmp/test-a
          /tmp/test-a
          g++ -O2 -std=c++17 -I browser_ver/core/shim -I upstream-expanded upstream-expanded/pet.cpp tests/package-c1.cpp -o /tmp/test-c1
          /tmp/test-c1
          g++ -O2 -std=c++17 -I tests/c2_wasm_stub -I browser_ver/core/shim -I upstream-expanded upstream-expanded/pet.cpp browser_ver/core/browser_expeditions.cpp tests/package-c2.cpp -o /tmp/test-c2
          /tmp/test-c2
          g++ -O2 -std=c++17 -I tests/c2_wasm_stub -I browser_ver/core/shim -I upstream-expanded upstream-expanded/battle.cpp upstream-expanded/i18n.cpp browser_ver/core/browser_minigames.cpp tests/package-c3.cpp -o /tmp/test-c3
          /tmp/test-c3
          /tmp/test-c3 --chart > /tmp/c3-type-chart.json
          node tests/package-c3.test.js
          g++ -O2 -std=c++17 -I browser_ver/core/shim -I upstream-expanded upstream-expanded/pet.cpp tests/package-c4.cpp -o /tmp/test-c4
          /tmp/test-c4
          g++ -O2 -std=c++17 -I browser_ver/core/shim -I upstream-expanded upstream-expanded/pet.cpp tests/package-c5.cpp -o /tmp/test-c5
          /tmp/test-c5
          /tmp/test-c5 --json > /tmp/c5-journal.json
          python3 -c 'import json; json.load(open("/tmp/c5-journal.json"))'
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build WASM core
        run: bash browser_ver/build.sh
      - name: Prepare test files
        shell: bash
        run: |
          set -e
          cp Resources/DefaultAppIcon.png browser_ver/web/icon.png
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" browser_ver/web/sw.js
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" browser_ver/web/index.html
          test -s browser_ver/web/tp_core.js
          test -s browser_ver/web/tp_core.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: iTamaPoke-Paket-C5-Test
          path: browser_ver/web
          if-no-files-found: error
          retention-days: 7
