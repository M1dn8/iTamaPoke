name: Erweiterte Regression (manuell)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml
    with:
      test_scope: regression
    permissions:
      contents: read
